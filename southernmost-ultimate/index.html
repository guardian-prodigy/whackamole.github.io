<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#041d1a"><title>Southernmost Ultimate Preview</title><style>*{box-sizing:border-box}html,body{height:100%}body{margin:0;display:grid;place-items:center;background:#041d1a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.loader{text-align:center;padding:2rem}.ring{width:52px;height:52px;margin:0 auto 1rem;border:4px solid #ffffff28;border-top-color:#ff8b5f;border-radius:50%;animation:spin .8s linear infinite}.loader h1{font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;margin:.4rem 0}.loader p{opacity:.65;margin:.35rem 0}@keyframes spin{to{transform:rotate(360deg)}}a{color:#ffb14d}</style></head><body><main class="loader"><div class="ring"></div><h1>Entering Southernmost</h1><p>Loading the interactive experience…</p></main><script>(async()=>{try{const r=await fetch('https://raw.githubusercontent.com/guardian-prodigy/whackamole.github.io/main/southernmost-ultimate/payload.txt',{cache:'no-store'});if(!r.ok)throw new Error('Payload '+r.status);const text=await r.text();const binary=Uint8Array.from(atob(text.replace(/\s/g,'')),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('Your browser does not support DecompressionStream. Open this preview in current Chrome, Edge, Firefox, or Safari.');const html=await new Response(new Blob([binary]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<main class="loader"><h1>Preview could not load</h1><p>'+String(e.message||e)+'</p><p><a href="https://github.com/guardian-prodigy/whackamole.github.io/tree/main/southernmost-ultimate">View the GitHub files</a></p></main>'}})();</script></body></html>
